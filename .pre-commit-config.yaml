repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      # Run on the repo so ruff.toml `include` scopes the check (same as CI).
      - id: ruff
        args: [--fix, .]
        pass_filenames: false
      - id: ruff-format
        args: [.]
        pass_filenames: false
