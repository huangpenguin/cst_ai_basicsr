repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(scripts/(battery_tiff_io|ci_gpu_smoke|data_paths|download_swinir_release|smoke_test_swinir_gray_dn|smoke_test_swinir_gray_dn_battery|swinir_gray_dn_infer)\.py|train\.py|main\.py)$
      - id: ruff-format
        files: ^(scripts/(battery_tiff_io|ci_gpu_smoke|data_paths|download_swinir_release|smoke_test_swinir_gray_dn|smoke_test_swinir_gray_dn_battery|swinir_gray_dn_infer)\.py|train\.py|main\.py)$

  - repo: local
    hooks:
      - id: pyright
        name: pyright (basic, pre-push)
        entry: uv run pyright -p pyrightconfig.pre-push.json
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
