line-length = 120
target-version = "py310"

# Only lint/format MLOps GPU paths; upstream BasicSR modules are out of scope.
include = [
  "scripts/data/battery_tiff_io.py",
  "scripts/ci/ci_gpu_smoke.py",
  "scripts/ci/ci_storage.py",
  "scripts/data/data_paths.py",
  "scripts/download/download_swinir_release.py",
  "scripts/infer/swinir_gray_dn_infer.py",
  "basicsr/data/paired_tiff_image_dataset.py",
  "apps/denoise_demo/*.py",
]

[lint]
select = ["E", "F", "B", "I"]

[lint.per-file-ignores]
"scripts/ci/ci_gpu_smoke.py" = ["E402"]
"apps/denoise_demo/app.py" = ["E402"]
"apps/denoise_demo/engine.py" = ["E402"]

[format]
line-ending = "lf"
