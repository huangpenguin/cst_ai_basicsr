# Gradio denoise demo checkpoint registry.
# Host NFS paths use /mnt/home/huang/cst_ai (verified on disk at write time).
# In the GPU container the same files appear under /home/huang/cst_ai;
# registry.resolve_ckpt_path swaps those prefixes when the listed path is missing.

default_id: swinir_mix

presets:
  - id: swinir_official_n15
    label: "[swinir_m] official PreFT (noise15)"
    family: swinir_m
    ckpt: experiments/pretrained_models/SwinIR/004_grayDN_DFWB_s128w8_SwinIR-M_noise15.pth
    param_key: params_ema
    notes: official PreFT (noise sigma 15)

  - id: swinir_preft
    label: "[swinir_m] official PreFT (noise25)"
    family: swinir_m
    ckpt: experiments/pretrained_models/SwinIR/004_grayDN_DFWB_s128w8_SwinIR-M_noise25.pth
    param_key: params_ema
    notes: official PreFT (noise sigma 25)

  - id: swinir_official_n50
    label: "[swinir_m] official PreFT (noise50)"
    family: swinir_m
    ckpt: experiments/pretrained_models/SwinIR/004_grayDN_DFWB_s128w8_SwinIR-M_noise50.pth
    param_key: params_ema
    notes: official PreFT (noise sigma 50)

  - id: swinir_aligned_drive
    label: "[swinir_m] aligned_drive (phantom)"
    family: swinir_m
    ckpt: /mnt/home/huang/cst_ai/experiments/aligned_drive/train_SwinIR_grayDN_paired_tiff_noise25_P128W8/models/net_g_latest.pth
    train_yaml: options/train/SwinIR/train_SwinIR_grayDN_paired_tiff.yml

  - id: swinir_cylinder90
    label: "[swinir_m] cylinder GT90µA"
    family: swinir_m
    ckpt: /mnt/home/huang/cst_ai/experiments/cylinder_260520_gt90ua/train_SwinIR_grayDN_cylinder_gt90ua_noise25_P128W8_bs4_i30k/models/net_g_latest.pth
    train_yaml: options/train/SwinIR/train_SwinIR_grayDN_cylinder_gt90ua_bs8_30k.yml

  - id: swinir_mix
    label: "[swinir_m] mix (cylinder+phantom)"
    family: swinir_m
    ckpt: /mnt/home/huang/cst_ai/experiments/cylinder_phantom_mix/train_SwinIR_grayDN_cylinder_phantom_mix_noise25_P128W8_bs4_i30k/models/net_g_latest.pth
    train_yaml: options/train/SwinIR/train_SwinIR_grayDN_cylinder_phantom_mix_bs4_30k.yml

  - id: swinir_alcast
    label: "[swinir_m] ALcast GT66mA"
    family: swinir_m
    ckpt: /mnt/home/huang/cst_ai/experiments/alcast_150kv_gt66ma/train_SwinIR_grayDN_alcast_gt66ma_noise25_P128W8_bs4_i30k/models/net_g_latest.pth
    train_yaml: options/train/SwinIR/train_SwinIR_grayDN_alcast_gt66ma_bs4_30k.yml

  - id: swinir_archive
    label: "[swinir_m] archive cylinderblock"
    family: swinir_m
    ckpt: /mnt/home/huang/cst_ai/archive/cylinderblock_2673001900/net_g_latest.pth

  - id: tsfdan_preft
    label: "[tsfdan] official PreFT"
    family: tsfdan
    ckpt: experiments/pretrained_models/TSFDAN/SwinTransformer_288800iter.ckpt

  - id: tsfdan_lora_mix
    label: "[tsfdan] LoRA mix (cylinder+phantom)"
    family: tsfdan
    ckpt: /mnt/home/huang/cst_ai/experiments/cylinder_phantom_mix_tsfdan_lora/train_TSFDAN_lora_cylinder_phantom_mix_P128_bs4_i10k/models/net_g_latest.pth
    train_yaml: options/train/SwinIR/train_TSFDAN_lora_cylinder_phantom_mix_bs4_10k.yml
