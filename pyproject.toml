[project]
name = "basicsr"
version = "0.1.0"
description = "Open Source Image and Video Super-Resolution Toolbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "addict",
    "future",
    "gradio>=6.25.0",
    "lmdb",
    "numpy>=1.17",
    "opencv-python-headless",
    "peft>=0.20.0",
    "Pillow",
    "pydantic>=2.13.4",
    "pywavelets>=1.9.0",
    "pyyaml",
    "requests",
    "scikit-image",
    "scipy",
    # setuptools>=82 removed pkg_resources; tensorboard/tb-nightly still import it at startup.
    "setuptools>=70,<82",
    "tb-nightly",
    "timm>=1.0.28",
    "torch>=2.6.0,<2.7.0",
    "torchvision>=0.21.0,<0.22.0",
    "tqdm",
    "wandb>=0.28.0",
    "yapf",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.410",
    "ruff>=0.15.18",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.uv]
package = false
