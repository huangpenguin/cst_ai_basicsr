# Docker executor GPU jobs — inference smoke / full inference (no training yet).
#
# Runner config.toml (once per GPU server — no per-user paths):
#   volumes = [
#     "/cache",
#     "/mnt/data:/data:ro",
#     "/mnt/home:/home:rw",
#   ]
#
# Data layout:
#   /data/<PROJECT_NAME>/...           raw team datasets (read-only)
#   /home/<user>/<PROJECT_NAME>/...    personal outputs / derived data (read-write)
#
# Per-repo overrides in GitLab CI/CD Variables or variables below:
#   DATASET_DIR, OUTPUT_DIR

variables:
  MLOPS_GPU_IMAGE: "pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: copy
  DATASET_DIR: "/data/cst_ai/data_0607/260520_1-battery_data/260520_battery image tiff data"
  OUTPUT_DIR: "/home/${GITLAB_USER_LOGIN}/cst_ai/ci_outputs/${CI_PIPELINE_ID}/swinir_gray_dn_battery_smoke"
  SMOKE_COMMAND: "python scripts/ci_gpu_smoke.py"
  INFERENCE_COMMAND: >-
    python scripts/download_swinir_release.py --only 004_grayDN &&
    python scripts/smoke_test_swinir_gray_dn_battery.py --devices 0,1,2,3

.gpu_docker_base:
  stage: deploy
  image: "$MLOPS_GPU_IMAGE"
  tags: [linux, docker, gpu]
  resource_group: gpu-training
  needs: []
  cache:
    key:
      files: [requirements.txt, pyproject.toml]
    paths: [.venv/, .cache/uv/, experiments/pretrained_models/SwinIR/]
    policy: pull-push
  before_script:
    - |
      set -euo pipefail
      nvidia-smi
      apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git
      if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="${HOME}/.local/bin:${PATH}"
      fi
      uv venv
      if [[ -f requirements.txt ]]; then
        uv pip install -r requirements.txt
      fi
      uv pip install -e .
      export PATH="${CI_PROJECT_DIR}/.venv/bin:${PATH}"
      python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
      echo "DATA_MOUNT_SOURCE=${DATA_MOUNT_SOURCE} HOME_MOUNT_SOURCE=${HOME_MOUNT_SOURCE}"
      echo "DATA_DIR=${DATA_DIR} PROJECT_NAME=${PROJECT_NAME} WORK_DIR=${WORK_DIR}"
      echo "DATASET_DIR=${DATASET_DIR} OUTPUT_DIR=${OUTPUT_DIR}"

.gpu_artifacts:
  after_script:
    - |
      set -euo pipefail
      if [[ -n "${OUTPUT_DIR:-}" && -d "${OUTPUT_DIR}" ]]; then
        mkdir -p "${CI_PROJECT_DIR}/results"
        rm -rf "${CI_PROJECT_DIR}/results/swinir_gray_dn_battery_smoke"
        cp -a "${OUTPUT_DIR}/." "${CI_PROJECT_DIR}/results/swinir_gray_dn_battery_smoke/"
        echo "Staged artifacts from ${OUTPUT_DIR}"
      fi
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - results/swinir_gray_dn_battery_smoke/

gpu_smoke:
  extends:
    - .gpu_docker_base
    - .gpu_artifacts
  timeout: 45m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  script:
    - bash -lc "${SMOKE_COMMAND}"

run_inference:
  extends:
    - .gpu_docker_base
    - .gpu_artifacts
  timeout: 2h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  script:
    - bash -lc "${INFERENCE_COMMAND}"
