# =============================================================================
# train.yml — Docker executor GPU 训练调度
# =============================================================================
#
# 【镜像】与 Dev Container 相同：Dockerfile → basicsr-mlops-gpu:2.6.0-cu124（FROM 官方 pytorch）。
# gpu01 首次：bash scripts/env/build_mlops_image.sh；依赖仍由 uv-bootstrap.sh 装入 .venv（与 postCreate 相同）。
#
# 【跑在哪】gpu01 上带 tag ``storage_huang`` 的项目 runner（user=huang uid，见 setup_gpu_data_layout.sh）。
#
# 【Runner volumes — 持久数据，job 结束后仍在宿主机】
#   /mnt/home:/home:rw  <->  host /mnt/home   （数据集 + 训练产出；唯一允许路径）
#   /mnt/data:/data:ro  <->  host /mnt/data   （原始 TIFF，只读）
#   /cache              <->  host /cache       （runner 卷；勿存数据集/实验产出）
#
# 【GitLab cache:（.gitlab-ci.yml 里 cache: 段）— 与 /cache 卷无关】
#   仅缓存 .venv/、.cache/uv/、预训练权重，加速同一 runner 上下次 job 装依赖；
#   日志里 "stored only locally" 表示未配 S3，但仍可在本机 runner 上复用。
# =============================================================================

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: copy
  DATA_DIR: "/data"
  PROJECT_NAME: "cst_ai"
  # GPU 宿主机 Unix 账号（与 /mnt/home/<user> 一致；GitLab 登录名常不同，勿用 GITLAB_USER_LOGIN）
  CST_STORAGE_USER: "huang"
  # Runner tag for NFS-writable jobs (second [[runners]] on gpu01 with user = huang uid/gid)
  RUNNER_STORAGE_TAG: "storage_huang"
  # Same tag as docker-compose.yml / Dev Container (built from Dockerfile)
  MLOPS_PROJECT_IMAGE: "basicsr-mlops-gpu:2.6.0-cu124"
  SMOKE_COMMAND: "python scripts/ci/ci_gpu_smoke.py"
  # 训练语义的唯一入口：路径 / name / num_gpu / port / timeout 等均在该 YAML 中改。
  # 换实验：改此处指向的 YAML。当前为 ALcast 150kV GT=66mA。
  TRAIN_OPT: "options/train/SwinIR/train_SwinIR_grayDN_alcast_gt66ma_bs4_30k.yml"
  # Pipeline-scoped run root still used for TB / markers via ci_storage.py prepare.
  TRAIN_CI_OUTPUTS_ROOT: "/home/${CST_STORAGE_USER}/cst_ai/ci_outputs"
  # Optional Weights & Biases (set WANDB_API_KEY in GitLab CI/CD variables)
  WANDB_PROJECT: "cst-ai-swinir-paired-tiff"
  # WANDB_ENTITY: "your-team-or-username"
  # TensorBoard lifecycle (started in train jobs, stopped in after_script).
  # Requires GPU runner network_mode=host (or published host port) for Mac SSH -L.
  TB_PORT: "6006"
.gpu_docker_base:
  stage: train
  image:
    name: "$MLOPS_PROJECT_IMAGE"
    pull_policy: if-not-present
  tags:
    - linux
    - docker
    - main_gpu
    - storage_huang
  resource_group: gpu-training
  needs: []
  cache:
    key:
      files:
        - pyproject.toml
        - uv.lock
    paths:
      - .venv/
      - .cache/uv/
      - experiments/pretrained_models/SwinIR/
    policy: pull-push
  before_script:
    - |
      set -euo pipefail

      echo "Runner: ${CI_RUNNER_DESCRIPTION:-unknown}"
      echo "Runner tags: ${CI_RUNNER_TAGS:-unknown}"
      if [[ "${CI_RUNNER_TAGS:-}" != *"${RUNNER_STORAGE_TAG}"* ]]; then
        echo "ERROR: job requires runner tag '${RUNNER_STORAGE_TAG}' (NFS write as ${CST_STORAGE_USER})." >&2
        echo "On gpu01: scripts/env/setup_gpu_data_layout.sh && register project runner (see docs/infrastructure.md)" >&2
        exit 1
      fi

      CONTAINER_UID="$(id -u)"
      CONTAINER_GID="$(id -g)"
      echo "Container user: ${CONTAINER_UID}:${CONTAINER_GID} (must not be 0:0 for NFS /home/${CST_STORAGE_USER})"
      if [[ "${CONTAINER_UID}" == "0" ]]; then
        echo "ERROR: job container runs as root. NFS root_squash blocks writes to /home/${CST_STORAGE_USER}/cst_ai." >&2
        echo "On gpu01, edit /etc/gitlab-runner/config.toml for THIS runner only (gpu01-storage-huang-runner):" >&2
        echo '  [runners.docker]' >&2
        echo '    user = "1003:1003"   # gpu01: id -u huang; id -g huang' >&2
        echo "  sudo gitlab-runner restart" >&2
        echo "Verify: docker run --rm --user 1003:1003 -v /mnt/home:/home:rw alpine touch /home/huang/cst_ai/ci_outputs/.test" >&2
        exit 1
      fi
      NFS_PROBE="/home/${CST_STORAGE_USER}/cst_ai/ci_outputs/.ci_write_probe"
      if ! (mkdir -p "$(dirname "${NFS_PROBE}")" && touch "${NFS_PROBE}" && rm -f "${NFS_PROBE}"); then
        echo "ERROR: cannot write under /home/${CST_STORAGE_USER}/cst_ai (uid ${CONTAINER_UID} on NFS)." >&2
        exit 1
      fi
      echo "NFS write probe OK: /home/${CST_STORAGE_USER}/cst_ai"

      echo "GitLab CI cache note: 'Cache file does not exist' on first job / new runner is normal."
      echo "  GitLab cache: reuses .venv/ between jobs (unrelated to host /cache volume)."
      echo "GPU image: ${MLOPS_PROJECT_IMAGE}"
      echo "DATA_DIR: ${DATA_DIR}"
      echo "PROJECT_NAME: ${PROJECT_NAME}"
      echo "CST_STORAGE_USER: ${CST_STORAGE_USER}"
      echo "GITLAB_USER_LOGIN: ${GITLAB_USER_LOGIN:-unknown}"
      echo "Host storage (after job): /mnt/home/${CST_STORAGE_USER}/cst_ai/ci_outputs/"

      if ! command -v nvidia-smi >/dev/null 2>&1; then
        echo "ERROR: nvidia-smi not found inside the job container." >&2
        echo "Check GitLab Runner docker executor config: [runners.docker] gpus = \"all\"." >&2
        exit 1
      fi
      nvidia-smi

      bash scripts/env/ensure_uv.sh

      if [[ ! -f scripts/env/uv-bootstrap.sh ]]; then
        echo "ERROR: scripts/env/uv-bootstrap.sh not found. Re-run init-ai add mlops-gpu --update --apply." >&2
        exit 1
      fi

      bash scripts/env/uv-bootstrap.sh

      if [[ -d .venv ]]; then
        export VIRTUAL_ENV="${CI_PROJECT_DIR}/.venv"
        export PATH="${VIRTUAL_ENV}/bin:${PATH}"
      fi

      if ! command -v python >/dev/null 2>&1; then
        echo "ERROR: python not found after uv-bootstrap." >&2
        exit 1
      fi

      python - <<'PY'
      import torch

      print("torch:", torch.__version__)
      print("cuda build:", torch.version.cuda)
      print("cuda available:", torch.cuda.is_available())
      print("device count:", torch.cuda.device_count())
      if not torch.cuda.is_available():
          raise SystemExit("CUDA is not available inside the GitLab Docker executor job container")
      PY

.gpu_train_artifacts:
  after_script:
    - |
      set -uo pipefail
      # Always recycle TensorBoard first (success or failure).
      if [[ -f "${CI_PROJECT_DIR}/.ci_run_root" ]]; then
        export CI_RUN_ROOT="$(cat "${CI_PROJECT_DIR}/.ci_run_root")"
      fi
      bash scripts/ci/ci_tensorboard.sh stop || true
      if [[ -f "${CI_PROJECT_DIR}/.ci_experiments_root" ]]; then
        export TRAIN_EXPERIMENTS_ROOT="$(cat "${CI_PROJECT_DIR}/.ci_experiments_root")"
      fi
      if [[ -f "${CI_PROJECT_DIR}/.ci_tb_logger_root" ]]; then
        BASICSR_TB_LOGGER_ROOT="$(cat "${CI_PROJECT_DIR}/.ci_tb_logger_root")"
      fi
      if [[ -n "${CI_RUN_ROOT:-}" ]]; then
        HOST_RUN_ROOT="$(python scripts/ci/ci_storage.py host-path "${CI_RUN_ROOT}" 2>/dev/null || true)"
        echo "Persistent CI_RUN_ROOT=${CI_RUN_ROOT}"
        if [[ -n "${HOST_RUN_ROOT}" ]]; then
          echo "  GPU host path: ${HOST_RUN_ROOT}"
          echo "  Latest symlink: $(dirname "${HOST_RUN_ROOT}")/latest"
          echo "  Re-serve TB later: bash scripts/ci/serve_tensorboard.sh ${HOST_RUN_ROOT}/tb_logger"
        fi
      fi
      if [[ -n "${TRAIN_EXPERIMENTS_ROOT:-}" && -d "${TRAIN_EXPERIMENTS_ROOT}" ]]; then
        mkdir -p "${CI_PROJECT_DIR}/results/paired_tiff_swinir"
        python scripts/ci/ci_stage_train_artifacts.py \
          --source "${TRAIN_EXPERIMENTS_ROOT}" \
          --target "${CI_PROJECT_DIR}/results/paired_tiff_swinir"
      fi
      if [[ -n "${BASICSR_TB_LOGGER_ROOT:-}" && -d "${BASICSR_TB_LOGGER_ROOT}" ]]; then
        echo "TensorBoard events on NFS: ${BASICSR_TB_LOGGER_ROOT}"
      fi
      # #region agent log
      echo "debug_after_script_ok hypothesisId=B" >> /home/huang/code/cst_ai/BasicSR/.cursor/debug-052c56.log || true
      # #endregion
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - results/paired_tiff_swinir/

.gpu_debug_artifacts:
  after_script:
    - |
      set -uo pipefail
      if [[ -f "${CI_PROJECT_DIR}/.ci_run_root" ]]; then
        export CI_RUN_ROOT="$(cat "${CI_PROJECT_DIR}/.ci_run_root")"
      fi
      bash scripts/ci/ci_tensorboard.sh stop || true
      if [[ -f "${CI_PROJECT_DIR}/.ci_experiments_root" ]]; then
        TRAIN_EXPERIMENTS_ROOT="$(cat "${CI_PROJECT_DIR}/.ci_experiments_root")"
      fi
      if [[ -n "${TRAIN_EXPERIMENTS_ROOT:-}" && -d "${TRAIN_EXPERIMENTS_ROOT}" ]]; then
        mkdir -p "${CI_PROJECT_DIR}/results/paired_tiff_swinir_debug"
        cp -a "${TRAIN_EXPERIMENTS_ROOT}/." "${CI_PROJECT_DIR}/results/paired_tiff_swinir_debug/" || true
        echo "Staged debug artifacts from ${TRAIN_EXPERIMENTS_ROOT}"
      fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - results/paired_tiff_swinir_debug/

gpu_smoke:
  extends: .gpu_docker_base
  timeout: 30m
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
      allow_failure: true
  script:
    - bash -lc "${SMOKE_COMMAND}"

# Short SwinIR train repro on the prepared metadata, 1 GPU, ~minutes.
train_paired_tiff_swinir_debug:
  extends:
    - .gpu_docker_base
    - .gpu_debug_artifacts
  timeout: 1h
  variables:
    CI_DEBUG_TOTAL_ITER: "30"
    CI_DEBUG_BATCH_SIZE: "1"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
      allow_failure: true
  script:
    - |
      set -euo pipefail
      eval "$(python scripts/ci/ci_emit_opt_env.py --opt "${TRAIN_OPT}")"
      eval "$(python scripts/ci/ci_storage.py prepare --debug --dataset-subdir "${PAIRED_DATASET_NAME}" --write-markers --emit-shell)"
      mkdir -p "${TRAIN_EXPERIMENTS_ROOT}"
      printf '%s\n' "${TRAIN_EXPERIMENTS_ROOT}" > "${CI_PROJECT_DIR}/.ci_experiments_root"
      required_paths=(
        "${TRAIN_DATAROOT_LQ}"
        "${TRAIN_DATAROOT_GT}"
        "${TRAIN_META_TRAIN}"
        "${TRAIN_NORM}"
      )
      for path in "${required_paths[@]}"; do
        [[ -e "${path}" ]] || { echo "ERROR: missing ${path}" >&2; exit 1; }
      done
      bash scripts/ci/ci_tensorboard.sh start "${BASICSR_TB_LOGGER_ROOT}"
      echo "TensorBoard: ssh -L ${TB_PORT}:localhost:${TB_PORT} <user>@<gpu-host> → http://localhost:${TB_PORT}"
      uv pip install -e . --no-deps
      python scripts/download/download_swinir_release.py --only noise25
      # Debug-only overrides (short run). Paths / name / experiments_root 一律以 YAML 为准。
      # val=~: skip online DDP val (same as formal ALcast YAML / TSFDAN).
      python basicsr/train.py \
        -opt "${TRAIN_OPT}" \
        --debug \
        --force_yml \
        "num_gpu=1" \
        "datasets:train:batch_size_per_gpu=${CI_DEBUG_BATCH_SIZE}" \
        "datasets:train:num_worker_per_gpu=0" \
        "train:total_iter=${CI_DEBUG_TOTAL_ITER}" \
        "val=~"

train_paired_tiff_swinir:
  extends:
    - .gpu_docker_base
    - .gpu_train_artifacts
  timeout: 48h
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
      allow_failure: true
  script:
    - |
      set -euo pipefail

      # 训练身份 / 路径 / 卡数 / 端口：全部从 TRAIN_OPT YAML 导出。
      eval "$(python scripts/ci/ci_emit_opt_env.py --opt "${TRAIN_OPT}")"
      eval "$(python scripts/ci/ci_storage.py prepare --dataset-subdir "${PAIRED_DATASET_NAME}" --write-markers --latest-symlink --emit-shell)"
      mkdir -p "${TRAIN_EXPERIMENTS_ROOT}"
      printf '%s\n' "${TRAIN_EXPERIMENTS_ROOT}" > "${CI_PROJECT_DIR}/.ci_experiments_root"
      python scripts/ci/ci_seed_resume.py \
        --experiments-root "${TRAIN_EXPERIMENTS_ROOT}" \
        --opt "${TRAIN_OPT}" \
        --ci-outputs-root "${TRAIN_CI_OUTPUTS_ROOT}"
      if [[ "${TRAIN_DATASET_DIR}" == /cache/* || "${TRAIN_EXPERIMENTS_ROOT}" == /cache/* ]]; then
        echo "ERROR: training paths must not use runner /cache (use /home/${CST_STORAGE_USER}/cst_ai on NFS)." >&2
        exit 1
      fi
      echo "TRAIN_OPT=${TRAIN_OPT}"
      echo "TRAIN_EXP_NAME=${TRAIN_EXP_NAME}"
      echo "TRAIN_DATASET_DIR=${TRAIN_DATASET_DIR}"
      echo "TRAIN_SOURCE_DIR=${TRAIN_SOURCE_DIR}"
      echo "TRAIN_EXPERIMENTS_ROOT=${TRAIN_EXPERIMENTS_ROOT}"
      echo "TRAIN_NPROC_PER_NODE=${TRAIN_NPROC_PER_NODE}"
      echo "TRAIN_MASTER_PORT=${TRAIN_MASTER_PORT}"
      echo "TRAIN_DIST_TIMEOUT_MIN=${TRAIN_DIST_TIMEOUT_MIN}"
      export TRAIN_DIST_TIMEOUT_MIN
      ls -lah "${TRAIN_EXPERIMENTS_ROOT}/${TRAIN_EXP_NAME}/training_states" || true
      ls -lah "${TRAIN_EXPERIMENTS_ROOT}/${TRAIN_EXP_NAME}/models" || true

      required_paths=(
        "${TRAIN_DATAROOT_LQ}"
        "${TRAIN_DATAROOT_GT}"
        "${TRAIN_META_TRAIN}"
        "${TRAIN_NORM}"
      )

      dataset_ready=true
      for path in "${required_paths[@]}"; do
        if [[ ! -e "${path}" ]]; then
          dataset_ready=false
          break
        fi
      done

      if [[ "${dataset_ready}" != "true" ]]; then
        echo "ERROR: aligned source data or split metadata is missing (paths from ${TRAIN_OPT})." >&2
        echo "On the GPU host, put same-name uint16 TIFF pairs in:" >&2
        echo "  /mnt/data/${PROJECT_NAME}/datasets/${PAIRED_DATASET_NAME}/{LQ,GT}" >&2
        echo "Then run:" >&2
        echo "  uv run python scripts/data/prepare_paired_tiff_dataset.py \\" >&2
        echo "    --source-root /mnt/data/${PROJECT_NAME}/datasets/${PAIRED_DATASET_NAME} \\" >&2
        echo "    --output-root /mnt/home/${CST_STORAGE_USER}/cst_ai/datasets/${PAIRED_DATASET_NAME} \\" >&2
        echo "    --overwrite" >&2
        echo "No rotation, resize, crop, or pixel copy is performed." >&2
        exit 1
      fi

      mkdir -p "${TRAIN_EXPERIMENTS_ROOT}"
      bash scripts/ci/ci_tensorboard.sh start "${BASICSR_TB_LOGGER_ROOT}"
      echo "TensorBoard: ssh -L ${TB_PORT}:localhost:${TB_PORT} <user>@<gpu-host> → http://localhost:${TB_PORT}"
      echo "Requires GPU runner [runners.docker] network_mode = \"host\" (or published ${TB_PORT})."
      echo "Online val disabled when YAML has val:~ ; formal metrics/panels run after train (test holdout + prior benches)."

      echo "CI_COMMIT_SHA=${CI_COMMIT_SHA}"
      if grep -qE '(torch\.distributed\.run|torchrun)[^\\n]*--use-env' .gitlab/ci/train.yml; then
        echo "ERROR: train.yml still passes --use-env to torch.distributed.run (removed in 8277276)." >&2
        echo "Start a fresh pipeline from main; do not Retry an old pipeline job." >&2
        exit 1
      fi
      uv pip install -e . --no-deps
      python -c "
      import inspect
      from datetime import timedelta
      from basicsr.utils import options as o
      from basicsr.utils.dist_util import _prepare_dist_init_kwargs
      assert hasattr(o, '_strip_local_rank_argv')
      assert _prepare_dist_init_kwargs({'timeout_min': 120})['timeout'] == timedelta(minutes=120)
      print('options_module', inspect.getfile(o))
      print('local_rank_fix_ok')
      print('dist_timeout_fix_ok')
      "

      python scripts/download/download_swinir_release.py --only noise25

      WANDB_FORCE_YML=()
      if [[ -n "${WANDB_API_KEY:-}" ]]; then
        export WANDB_PROJECT="${WANDB_PROJECT:-cst-ai-swinir-paired-tiff}"
        WANDB_FORCE_YML+=("logger:wandb:project=${WANDB_PROJECT}")
        if [[ -n "${WANDB_ENTITY:-}" ]]; then
          WANDB_FORCE_YML+=("logger:wandb:entity=${WANDB_ENTITY}")
        fi
        echo "WANDB enabled: project=${WANDB_PROJECT}"
      else
        echo "WANDB disabled (set WANDB_API_KEY in GitLab CI/CD variables to enable)."
      fi

      # 正式训练：不再用 --force_yml 覆盖路径；仅可选注入 wandb。
      TORCHRUN_ARGS=(
        --nproc_per_node="${TRAIN_NPROC_PER_NODE}"
        --master_port="${TRAIN_MASTER_PORT}"
        basicsr/train.py
        -opt "${TRAIN_OPT}"
        --launcher pytorch
        --auto_resume
      )
      if ((${#WANDB_FORCE_YML[@]})); then
        TORCHRUN_ARGS+=(--force_yml "${WANDB_FORCE_YML[@]}")
      fi
      python -m torch.distributed.run "${TORCHRUN_ARGS[@]}"
