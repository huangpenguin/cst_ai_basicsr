# SwinIR grayscale denoising for already aligned uint16 TIFF pairs.
# Data paths are placeholders overridden by local commands or GitLab CI.
name: train_SwinIR_grayDN_paired_tiff_noise25_P128W8
model_type: SwinIRModel
scale: 1
num_gpu: auto
manual_seed: 0

datasets:
  train:
    name: AlignedPairedTiffTrain
    type: PairedTiffImageDataset
    dataroot_gt: /data/cst_ai/datasets/paired_tiff/GT
    dataroot_lq: /data/cst_ai/datasets/paired_tiff/LQ
    normalization: /home/huang/cst_ai/datasets/paired_tiff/normalization.json
    meta_info_file: /home/huang/cst_ai/datasets/paired_tiff/train.txt
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 128
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: AlignedPairedTiffVal
    type: PairedTiffImageDataset
    dataroot_gt: /data/cst_ai/datasets/paired_tiff/GT
    dataroot_lq: /data/cst_ai/datasets/paired_tiff/LQ
    normalization: /home/huang/cst_ai/datasets/paired_tiff/normalization.json
    meta_info_file: /home/huang/cst_ai/datasets/paired_tiff/val.txt
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: SwinIR
  upscale: 1
  in_chans: 1
  img_size: 128
  window_size: 8
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: ''
  resi_connection: '1conv'

path:
  pretrain_network_g: experiments/pretrained_models/SwinIR/004_grayDN_DFWB_s128w8_SwinIR-M_noise25.pth
  param_key_g: params_ema
  strict_load_g: true
  resume_state: ~
  experiments_root: experiments

train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [7500, 12000]
    gamma: 0.5

  total_iter: 15000
  warmup_iter: -1

  # MSE directly optimizes error power (PSNR/reference SNR). Override with
  # L1Loss or CharbonnierLoss for controlled comparisons.
  pixel_opt:
    type: MSELoss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: !!float 5e3
  save_img: false
  # Log a few LQ/pred/GT panels to TensorBoard each validation.
  tb_image_count: 2
  tile_size: 256
  tile_overlap: 32
  metrics:
    snr:
      type: calculate_snr
      crop_border: 0
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    entity: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
  timeout_min: 120
