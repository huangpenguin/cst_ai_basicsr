# =============================================================================
# SwinIR 灰度去噪 — cylinder_260520_gt90ua + aligned_drive 混合集
# 数据：/data/cst_ai/datasets/cylinder_phantom_mix（hardlink，前缀 cyl__/ph__）
# 在 gpu01 上：uv run python -m torch.distributed.run --standalone --nproc_per_node=4 basicsr/train.py -opt <本文件> --launcher pytorch
# =============================================================================

name: train_SwinIR_grayDN_cylinder_phantom_mix_noise25_P128W8_bs4_i30k

model_type: SwinIRModel
scale: 1
num_gpu: 4
manual_seed: 0

datasets:
  train:
    name: CylinderPhantomMixTrain
    type: PairedTiffImageDataset
    dataroot_gt: /data/cst_ai/datasets/cylinder_phantom_mix/GT
    dataroot_lq: /data/cst_ai/datasets/cylinder_phantom_mix/LQ
    normalization: /home/huang/cst_ai/datasets/cylinder_phantom_mix/normalization.json
    meta_info_file: /home/huang/cst_ai/datasets/cylinder_phantom_mix/train.txt
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 128
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: CylinderPhantomMixVal
    type: PairedTiffImageDataset
    dataroot_gt: /data/cst_ai/datasets/cylinder_phantom_mix/GT
    dataroot_lq: /data/cst_ai/datasets/cylinder_phantom_mix/LQ
    normalization: /home/huang/cst_ai/datasets/cylinder_phantom_mix/normalization.json
    meta_info_file: /home/huang/cst_ai/datasets/cylinder_phantom_mix/val.txt
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: SwinIR
  upscale: 1
  in_chans: 1
  img_size: 128
  window_size: 8
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: ''
  resi_connection: '1conv'

path:
  pretrain_network_g: experiments/pretrained_models/SwinIR/004_grayDN_DFWB_s128w8_SwinIR-M_noise25.pth
  param_key_g: params_ema
  strict_load_g: true
  resume_state: ~
  experiments_root: /home/huang/cst_ai/experiments/cylinder_phantom_mix

train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [15000, 25000]
    gamma: 0.5

  total_iter: 30000
  warmup_iter: -1

  pixel_opt:
    type: MSELoss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: !!float 2e3
  save_img: false
  max_num: 32
  tb_image_count: 2
  tile_size: 256
  tile_overlap: 32
  metrics:
    snr:
      type: calculate_snr
      crop_border: 0
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 2e3
  use_tb_logger: true
  wandb:
    project: ~
    entity: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
  timeout_min: 120
