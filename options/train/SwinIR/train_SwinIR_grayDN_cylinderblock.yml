# general settings
name: train_SwinIR_grayDN_cylinderblock_noise25_ft_P128W8
model_type: SwinIRModel
scale: 1
num_gpu: auto
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: CylinderblockPairedTrain
    type: PairedTiffImageDataset
    dataroot_gt: datasets/swinir_cylinderblock_paired/train/GT
    dataroot_lq: datasets/swinir_cylinderblock_paired/train/LQ
    normalization: datasets/swinir_cylinderblock_paired/normalization.json
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 128
    use_hflip: true
    use_rot: true

    # data loader
    num_worker_per_gpu: 4
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: CylinderblockPairedVal
    type: PairedTiffImageDataset
    dataroot_gt: datasets/swinir_cylinderblock_paired/val/GT
    dataroot_lq: datasets/swinir_cylinderblock_paired/val/LQ
    normalization: datasets/swinir_cylinderblock_paired/normalization.json
    filename_tmpl: '{}'
    io_backend:
      type: disk

# network structures
network_g:
  type: SwinIR
  upscale: 1
  in_chans: 1
  img_size: 128
  window_size: 8
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: ''
  resi_connection: '1conv'

# path
path:
  pretrain_network_g: experiments/pretrained_models/SwinIR/004_grayDN_DFWB_s128w8_SwinIR-M_noise25.pth
  param_key_g: params_ema
  strict_load_g: true
  resume_state: ~
  experiments_root: experiments

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [50000, 80000, 90000]
    gamma: 0.5

  total_iter: 15000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 2e3
  save_img: false
  tile_size: 128
  tile_overlap: 32

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
  # NCCL collective timeout (minutes). Default PyTorch is 10m; full-res val on rank 0 can exceed that.
  timeout_min: 120
