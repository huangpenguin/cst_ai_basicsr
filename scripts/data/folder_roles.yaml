# EDIT THIS FILE — mark each scan folder as gt / lq / skip
#
# Rules used by scripts/data/organize_paired_tiff_by_folder.py:
#   - one or more folders with role: gt (one GT per group directory, e.g. 5-1)
#   - one or more folders with role: lq
#   - skip = ignore
#
# Pairing is within the same parent group (5-1/5-2/5-3/5-4):
#   LQ under 5-1 pairs with GT under 5-1 by the same original stem (data_0842).
# Final flat names still go into one shared LQ/ and GT/:
#   {lq_folder}_{stem_without_data_prefix}.tif
#   e.g. 1-150kV_4uA_11fr_2x2_600pj_0842.tif

dataset_name: aligned_drive

# Inclusive Z-slice indices from original stems (data_0275.tif -> 275).
# Blank reconstruction slices outside these ranges are dropped from LQ/GT.
slice_ranges:
  "5-1": {start: 275, end: 623}
  "5-2": {start: 185, end: 740}
  "5-3": {start: 185, end: 745}
  "5-4": {start: 185, end: 745}

