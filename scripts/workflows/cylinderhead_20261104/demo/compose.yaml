name: basicsr-demo
services:
  demo:
    build: .
    image: basicsr-denoise-demo:2.6.0-cu124
    container_name: denoise-demo
    restart: unless-stopped
    gpus: all
    # Host NVIDIA devices are owned by vglusers (GID 1001), mode 0660.
    group_add:
      - "1001"
    shm_size: 2gb
    ports:
      - "7860:7860"
    volumes:
      - /mnt/home/huang/code/cst_ai/BasicSR:/workspace:ro
      - /mnt/home/huang/cst_ai:/mnt/home/huang/cst_ai:ro
    healthcheck:
      test: ["CMD", "/opt/basicsr-venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=5).read(1)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
