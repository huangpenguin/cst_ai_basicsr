# 根 CI 编排文件：定义全局 pipeline 行为，具体 job 拆到 .gitlab/ci/ 下。
# GitLab 会在 push / MR 时读取本文件并创建 pipeline。
#
# quality.yml 负责 Ruff/Pyright；train.yml 负责 SwinIR-M GPU smoke/debug/正式训练；
# train_tsfdan.yml 负责 TSFDAN+LoRA 独立 job（不改默认 TRAIN_OPT）。

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Repo default branch is master (GitLab remote); keep main for compatibility.
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"

stages:
  - quality
  - train

variables:
  FF_USE_FASTZIP: "true"
  UV_LINK_MODE: copy

include:
  - local: .gitlab/ci/quality.yml
  - local: .gitlab/ci/train.yml
  - local: .gitlab/ci/train_tsfdan.yml
