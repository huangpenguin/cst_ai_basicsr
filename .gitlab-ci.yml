# 根 CI 编排文件：定义全局 pipeline 行为，具体 job 拆到 .gitlab/ci/ 下。
# GitLab 会在 push / MR 时读取本文件并创建 pipeline。
#
# quality.yml 负责 Ruff/Pyright。训练在 gpu01 上按 options/train 的 YAML 直接启动，不经过 CI。

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Repo default branch is master (GitLab remote); keep main for compatibility.
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"

stages:
  - quality

variables:
  FF_USE_FASTZIP: "true"
  UV_LINK_MODE: copy

include:
  - local: .gitlab/ci/quality.yml
